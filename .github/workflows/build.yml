name: Build LaTeX CV

on:
  push:
    branches: [master]
    paths:
      - 'cv.tex'
      - 'cv-cn.tex'
      - 'citations.bib'
      - 'Makefile'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [master]
    paths:
      - 'cv.tex'
      - 'cv-cn.tex'
      - 'citations.bib'
      - 'Makefile'
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build English CV
        uses: xu-cheng/latex-action@v3
        with:
          root_file: cv.tex
          latexmk_use_xelatex: true
          latexmk_shell_escape: true
          extra_system_packages: py3-pygments

      - name: Build Chinese CV
        uses: xu-cheng/latex-action@v3
        with:
          root_file: cv-cn.tex
          latexmk_use_xelatex: true
          latexmk_shell_escape: true
          extra_system_packages: py3-pygments

      - name: Upload English CV PDF
        uses: actions/upload-artifact@v4
        with:
          name: cv-en
          path: cv.pdf
          if-no-files-found: error

      - name: Upload Chinese CV PDF
        uses: actions/upload-artifact@v4
        with:
          name: cv-cn
          path: cv-cn.pdf
          if-no-files-found: error
