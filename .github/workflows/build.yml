name: Build LaTeX CV

on:
  push:
    branches: [master]
    paths:
      - '*.tex'
      - 'shared/**'
      - 'sections/**'
      - 'Makefile'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [master]
    paths:
      - '*.tex'
      - 'shared/**'
      - 'sections/**'
      - 'Makefile'
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build all four CVs
        uses: xu-cheng/latex-action@v3
        with:
          root_file: |
            cv.tex
            cv-cn.tex
            cv-a.tex
            cv-a-cn.tex
          latexmk_use_xelatex: true
          latexmk_shell_escape: true
          extra_system_packages: py3-pygments

      - name: Upload industry CV (en)
        uses: actions/upload-artifact@v4
        with:
          name: cv-en
          path: cv.pdf
          if-no-files-found: error

      - name: Upload industry CV (cn)
        uses: actions/upload-artifact@v4
        with:
          name: cv-cn
          path: cv-cn.pdf
          if-no-files-found: error

      - name: Upload academic CV (en)
        uses: actions/upload-artifact@v4
        with:
          name: cv-a-en
          path: cv-a.pdf
          if-no-files-found: error

      - name: Upload academic CV (cn)
        uses: actions/upload-artifact@v4
        with:
          name: cv-a-cn
          path: cv-a-cn.pdf
          if-no-files-found: error

      - name: Publish PDFs to Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest CV
          files: |
            cv.pdf
            cv-cn.pdf
            cv-a.pdf
            cv-a-cn.pdf
